# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: lint.yaml

permissions: read-all

# a new commit on a pull request cancels that pull request's earlier run
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # lotri itself is installed so object_usage_linter can resolve the
      # package's own (and its compiled routines') symbols.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Pinned: a new lintr default linter would otherwise fail CI with no
          # code change; bump deliberately and fix the new lints in the same PR.
          extra-packages: lintr@3.4.0, any::cyclocomp, local::.
          needs: lint

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
